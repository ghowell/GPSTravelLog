<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

          <!-- Checkboxes will be inserted here -->
        </div>
      </div>
    </div>
    <div id="map" class="w-full h-[60vh] bg-gray-200 rounded"></div>
  </div>
